name: Dependency Review

# Run on every PR, including workflow and tooling changes. A path filter would
# leave a required check pending on other PRs and miss newly introduced locks.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pulse-dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject newly introduced high and critical advisories
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          warn-only: false
