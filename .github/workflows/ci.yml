name: Verify Pulse
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The npm release reuses the complete verification unchanged.
  workflow_call:
env:
  WRANGLER_SEND_METRICS: 'false'
permissions:
  contents: read
concurrency:
  group: pulse-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Public source CI uses standard GitHub-hosted runners only.
    # Live provider credentials and analytics never enter this workflow.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - name: Verify Node toolchain
        run: |
          node --version
          node -e 'const v=process.versions.node.split(".").map(Number); if(v[0]<24||(v[0]===24&&v[1]<15))process.exit(1)'
      - run: npm ci
      - run: npm run check
      - run: npm run worker:check
      - run: npm run test:d1
      - run: npm run test:worker
      - name: Install the locked browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  # npm releases publish only through the source-locked publisher. Every change
  # proves it still prepares and passes its audit, so a new advisory fails here
  # before a release tag. Read-only: no package source, install or credentials.
  publisher:
    name: Source-locked npm publisher audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out only the reviewed publisher tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/source-publisher.mjs
            /scripts/extract-publisher-source.py
            /scripts/audit-publishing-tooling.mjs
            /tooling/publisher/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Prepare and audit the source-locked publisher
        env:
          npm_config_cache: ${{ runner.temp }}/publisher-audit-cache
        run: |
          set -euo pipefail
          node scripts/source-publisher.mjs prepare "$RUNNER_TEMP/pulse-publisher"
          node scripts/source-publisher.mjs audit "$RUNNER_TEMP/pulse-publisher" "$RUNNER_TEMP/publisher-audit.json"
