name: Verify Pulse
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The npm release reuses the complete verification unchanged.
  workflow_call:
env:
  WRANGLER_SEND_METRICS: 'false'
permissions:
  contents: read
concurrency:
  group: pulse-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Public source CI uses standard GitHub-hosted runners only.
    # Live provider credentials and analytics never enter this workflow.
    runs-on: ubuntu-24.04
    # Use the preinstalled browsers and OS dependencies from an immutable
    # Playwright image; avoid apt mirror DNS failures during npm PR verification.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The container user is different from the runner's checkout owner.
      # Git-based source verification needs this exact repo path to be trusted.
      - name: Trust the checked-out workspace in the browser container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - name: Verify Node toolchain
        run: |
          node --version
          node -e 'const v=process.versions.node.split(".").map(Number); if(v[0]<24||(v[0]===24&&v[1]<15))process.exit(1)'
      - run: npm ci
      - run: npm run check
      # Independent TLS/adversarial acceptance is a required release gate too.
      - run: openssl version
      - run: npm run test:selfhost:hostile
      - run: npm run worker:check
      - run: npm run test:d1
      - run: npm run test:worker
      - name: Verify pinned browser image matches the locked Playwright version
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { readFileSync } = require('node:fs');
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const version = lock.packages['node_modules/@playwright/test']?.version;
          assert.match(version ?? '', /^\d+\.\d+\.\d+$/);
          assert.equal(lock.packages['node_modules/playwright-core']?.version, version);
          const image = JSON.parse(readFileSync('/ms-playwright/.docker-info', 'utf8'));
          assert.equal(image.driverVersion, version, 'Update the pinned image and digest with Playwright');
          assert.equal(image.dockerImageName, 'mcr.microsoft.com/playwright:v' + version + '-noble');
          NODE
      - run: npm run test:browser
      - run: npm run test:browser:evidence

  # npm releases publish only through the source-locked publisher. Every change
  # proves it still prepares and passes its audit, so a new advisory fails here
  # before a release tag. Read-only: no package source, install or credentials.
  publisher:
    name: Source-locked npm publisher audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out only the reviewed publisher tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/source-publisher.mjs
            /scripts/extract-publisher-source.py
            /scripts/audit-publishing-tooling.mjs
            /tooling/publisher/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Prepare and audit the source-locked publisher
        env:
          npm_config_cache: ${{ runner.temp }}/publisher-audit-cache
        run: |
          set -euo pipefail
          node scripts/source-publisher.mjs prepare "$RUNNER_TEMP/pulse-publisher"
          node scripts/source-publisher.mjs audit "$RUNNER_TEMP/pulse-publisher" "$RUNNER_TEMP/publisher-audit.json"
