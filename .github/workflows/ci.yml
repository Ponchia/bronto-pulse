name: Verify Pulse
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  WRANGLER_SEND_METRICS: 'false'
permissions:
  contents: read
concurrency:
  group: pulse-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Public source CI uses standard GitHub-hosted runners only.
    # Live provider credentials and analytics never enter this workflow.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Verify Node toolchain
        run: |
          node --version
          node -e 'const v=process.versions.node.split(".").map(Number); if(v[0]<24||(v[0]===24&&v[1]<15))process.exit(1)'
      - run: npm ci
      - run: npm run check
      - run: npm run worker:check
      - run: npm run test:d1
      - name: Install the locked browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
