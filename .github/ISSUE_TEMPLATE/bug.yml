name: Bug or incorrect metric
description: Report a reproducible defect without exposing private analytics or credentials.
title: '[bug] '
body:
  - type: markdown
    attributes:
      value: 'Security vulnerabilities belong in a private report, not this form. Use synthetic fixtures; never paste tokens, cookies, private queries or raw provider responses.'
  - type: input
    id: version
    attributes:
      label: Version or commit and runtime
      placeholder: 'Commit, Node version, SQLite or D1, CLI or Worker'
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Commands and synthetic configuration, including source group, dates and timezone where relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
      description: Distinguish the reporting definition from the upstream dashboard's definition.
    validations:
      required: true
  - type: textarea
    id: quality
    attributes:
      label: Quality and recovery
      description: Did coverage, sampling, provisional dates or a failed refresh affect the result? Does prior history remain intact?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials and used synthetic examples rather than private visitor or search data.
          required: true
